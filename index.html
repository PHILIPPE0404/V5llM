<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testeur de requêtes</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 720px;
    background: #1f2937;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

h1 {
    text-align: center;
    margin-top: 0;
}

.field {
    margin: 18px 0;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #374151;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    box-shadow: 0 0 0 2px #60a5fa;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.stop {
    background: #dc2626;
}

.stop:hover {
    background: #b91c1c;
}

.hidden {
    display: none !important;
}

/* PIN */

#pinScreen {
    width: 92%;
    max-width: 400px;
    background: #1f2937;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

#pinScreen h1 {
    margin-bottom: 25px;
}

.pinError {
    color: #f87171;
    text-align: center;
    margin-top: 12px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 20px;
}

.stat {
    background: #374151;
    padding: 12px 5px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
}

.stat strong {
    display: block;
    margin-top: 5px;
    font-size: 21px;
}

/* PROGRESSION */

.progress-container {
    height: 20px;
    margin-top: 20px;
    background: #374151;
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;
    background: #22c55e;
    transition: width .15s;
}

.progressText {
    text-align: center;
    margin-top: 7px;
    color: #9ca3af;
}

/* LOG */

.logs {
    height: 200px;
    margin-top: 20px;
    padding: 12px;
    background: #111827;
    border-radius: 10px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 13px;
}

.info {
    margin-top: 15px;
    text-align: center;
    color: #9ca3af;
    font-size: 13px;
}

@media(max-width:600px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>


<!-- ========================= -->
<!-- ÉCRAN PIN -->
<!-- ========================= -->

<div id="pinScreen">

    <h1>🔐 Accès</h1>

    <div class="field">

        <label for="pin">
            Code PIN
        </label>

        <input
            id="pin"
            type="password"
            inputmode="numeric"
            maxlength="20"
            placeholder="Entrez le code PIN"
        >

    </div>

    <button id="pinButton">
        🔓 Entrer
    </button>

    <div
        id="pinError"
        class="pinError hidden"
    >
        ❌ Code incorrect
    </div>

</div>


<!-- ========================= -->
<!-- APPLICATION -->
<!-- ========================= -->

<div
    id="app"
    class="container hidden"
>

    <h1>🧪 Testeur de requêtes</h1>


    <!-- SITE -->

    <div class="field">

        <label for="url">
            🌐 Site à tester
        </label>

        <input
            type="url"
            id="url"
            value="http://127.0.0.1:5000/"
            placeholder="https://ton-serveur.onrender.com/"
        >

    </div>


    <!-- MODE -->

    <div class="field">

        <label for="mode">
            ⚙️ Mode de test
        </label>

        <select id="mode">

            <option value="nombre">
                🔢 Nombre de requêtes
            </option>

            <option value="duree">
                ⏱️ Durée du test
            </option>

        </select>

    </div>


    <!-- MODE NOMBRE -->

    <div id="modeNombre">

        <div class="field">

            <label for="nombre">
                🔢 Nombre de requêtes
            </label>

            <input
                type="number"
                id="nombre"
                value="100"
                min="1"
                max="10000"
            >

        </div>

    </div>


    <!-- MODE DURÉE -->

    <div
        id="modeDuree"
        class="hidden"
    >

        <div class="field">

            <label for="duree">
                ⌛ Durée du test (secondes)
            </label>

            <input
                type="number"
                id="duree"
                value="30"
                min="1"
                max="3600"
            >

        </div>

    </div>


    <!-- DÉLAI -->

    <div class="field">

        <label for="temps">
            ⏱️ Temps entre les requêtes (ms)
        </label>

        <input
            type="number"
            id="temps"
            value="100"
            min="10"
            max="60000"
        >

    </div>


    <!-- BOUTONS -->

    <button id="start">
        ▶️ Démarrer
    </button>

    <button
        id="stop"
        class="stop hidden"
    >
        ⛔ Arrêter
    </button>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            Total
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            Acceptées
            <strong id="acceptees">0</strong>
        </div>

        <div class="stat">
            426
            <strong id="status426">0</strong>
        </div>

        <div class="stat">
            429
            <strong id="status429">0</strong>
        </div>

        <div class="stat">
            Erreurs
            <strong id="erreurs">0</strong>
        </div>

    </div>


    <!-- PROGRESSION -->

    <div class="progress-container">

        <div
            class="progress"
            id="progress"
        ></div>

    </div>

    <div
        class="progressText"
        id="progressText"
    >
        0 %
    </div>


    <!-- LOG -->

    <div
        class="logs"
        id="logs"
    ></div>


    <div class="info">
        Utilise uniquement un serveur que tu contrôles ou que tu es autorisé à tester.
    </div>

</div>


<script>

/* =====================================
   CONFIGURATION
===================================== */

const PIN = "pantalontulipefleurs";


/* =====================================
   ELEMENTS
===================================== */

const pinScreen =
    document.getElementById("pinScreen");

const pinInput =
    document.getElementById("pin");

const pinButton =
    document.getElementById("pinButton");

const pinError =
    document.getElementById("pinError");

const app =
    document.getElementById("app");

const mode =
    document.getElementById("mode");

const modeNombre =
    document.getElementById("modeNombre");

const modeDuree =
    document.getElementById("modeDuree");

const urlInput =
    document.getElementById("url");

const nombreInput =
    document.getElementById("nombre");

const dureeInput =
    document.getElementById("duree");

const tempsInput =
    document.getElementById("temps");

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const totalElement =
    document.getElementById("total");

const accepteesElement =
    document.getElementById("acceptees");

const status426Element =
    document.getElementById("status426");

const status429Element =
    document.getElementById("status429");

const erreursElement =
    document.getElementById("erreurs");

const progress =
    document.getElementById("progress");

const progressText =
    document.getElementById("progressText");

const logs =
    document.getElementById("logs");


/* =====================================
   VARIABLES
===================================== */

let enCours = false;

let total = 0;
let acceptees = 0;
let status426 = 0;
let status429 = 0;
let erreurs = 0;


/* =====================================
   PIN
===================================== */

function verifierPIN() {

    if (pinInput.value === PIN) {

        pinScreen.classList.add("hidden");

        app.classList.remove("hidden");

    } else {

        pinError.classList.remove("hidden");

        pinInput.value = "";

        pinInput.focus();

    }

}


pinButton.addEventListener(
    "click",
    verifierPIN
);


pinInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            verifierPIN();
        }

    }
);


/* =====================================
   CHANGEMENT DE MODE
===================================== */

mode.addEventListener(
    "change",
    () => {

        if (mode.value === "nombre") {

            modeNombre.classList.remove("hidden");

            modeDuree.classList.add("hidden");

        } else {

            modeNombre.classList.add("hidden");

            modeDuree.classList.remove("hidden");

        }

    }
);


/* =====================================
   ATTENDRE
===================================== */

function attendre(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}


/* =====================================
   LOG
===================================== */

function ajouterLog(message) {

    const ligne =
        document.createElement("div");

    const heure =
        new Date().toLocaleTimeString();

    ligne.textContent =
        `[${heure}] ${message}`;

    logs.appendChild(ligne);

    logs.scrollTop =
        logs.scrollHeight;

}


/* =====================================
   STATS
===================================== */

function mettreAJour(progression = 0) {

    totalElement.textContent =
        total;

    accepteesElement.textContent =
        acceptees;

    status426Element.textContent =
        status426;

    status429Element.textContent =
        status429;

    erreursElement.textContent =
        erreurs;

    const valeur =
        Math.min(100, Math.max(0, progression));

    progress.style.width =
        valeur + "%";

    progressText.textContent =
        Math.round(valeur) + " %";

}


/* =====================================
   RÉINITIALISER
===================================== */

function resetStats() {

    total = 0;
    acceptees = 0;
    status426 = 0;
    status429 = 0;
    erreurs = 0;

    logs.innerHTML = "";

    mettreAJour(0);

}


/* =====================================
   UNE REQUÊTE
===================================== */

async function faireRequete(URL_TEST) {

    try {

        const reponse =
            await fetch(
                URL_TEST,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        total++;


        if (reponse.status === 429) {

            status429++;

            ajouterLog(
                `🔴 ${total} → 429`
            );

        }

        else if (reponse.status === 426) {

            status426++;

            ajouterLog(
                `🟠 ${total} → 426`
            );

        }

        else if (reponse.ok) {

            acceptees++;

            ajouterLog(
                `🟢 ${total} → ${reponse.status}`
            );

        }

        else {

            erreurs++;

            ajouterLog(
                `⚠️ ${total} → ${reponse.status}`
            );

        }

    }

    catch (erreur) {

        total++;

        erreurs++;

        ajouterLog(
            `⚠️ ${total} → erreur réseau`
        );

    }

}


/* =====================================
   LANCER LE TEST
===================================== */

async function lancerTest() {

    if (enCours) {
        return;
    }


    const URL_TEST =
        urlInput.value.trim();


    const delai =
        parseInt(tempsInput.value);


    if (!URL_TEST) {

        alert(
            "Entre l'adresse du serveur à tester."
        );

        return;
    }


    if (
        isNaN(delai) ||
        delai < 10
    ) {

        alert(
            "Le délai doit être d'au moins 10 ms."
        );

        return;
    }


    resetStats();

    enCours = true;

    startButton.classList.add("hidden");

    stopButton.classList.remove("hidden");


    ajouterLog(
        `🌐 ${URL_TEST}`
    );


    ajouterLog(
        `⏱️ Intervalle : ${delai} ms`
    );


    /* ==========================
       MODE NOMBRE
    ========================== */

    if (mode.value === "nombre") {

        const objectif =
            parseInt(nombreInput.value);


        if (
            isNaN(objectif) ||
            objectif < 1 ||
            objectif > 10000
        ) {

            alert(
                "Le nombre doit être compris entre 1 et 10 000."
            );

            terminerTest();

            return;
        }


        ajouterLog(
            `🔢 Objectif : ${objectif} requêtes`
        );


        while (
            enCours &&
            total < objectif
        ) {

            await faireRequete(
                URL_TEST
            );


            const progression =
                (total / objectif) * 100;


            mettreAJour(
                progression
            );


            if (
                enCours &&
                total < objectif
            ) {

                await attendre(
                    delai
                );

            }

        }

    }


    /* ==========================
       MODE DURÉE
    ========================== */

    else {

        const duree =
            parseInt(dureeInput.value);


        if (
            isNaN(duree) ||
            duree < 1 ||
            duree > 3600
        ) {

            alert(
                "La durée doit être comprise entre 1 et 3600 secondes."
            );

            terminerTest();

            return;
        }


        const debut =
            Date.now();

        const fin =
            debut + duree * 1000;


        ajouterLog(
            `⌛ Durée : ${duree} secondes`
        );


        while (
            enCours &&
            Date.now() < fin
        ) {

            await faireRequete(
                URL_TEST
            );


            const maintenant =
                Date.now();


            const progression =
                ((maintenant - debut) /
                (duree * 1000)) * 100;


            mettreAJour(
                Math.min(100, progression)
            );


            if (
                enCours &&
                Date.now() < fin
            ) {

                await attendre(
                    delai
                );

            }

        }

    }


    if (enCours) {

        mettreAJour(100);

        ajouterLog(
            "🏁 Test terminé."
        );

    }


    terminerTest();

}


/* =====================================
   TERMINER
===================================== */

function terminerTest() {

    enCours = false;

    startButton.classList.remove("hidden");

    stopButton.classList.add("hidden");

}


/* =====================================
   DÉMARRER
===================================== */

startButton.addEventListener(
    "click",
    lancerTest
);


/* =====================================
   ARRÊTER
===================================== */

stopButton.addEventListener(
    "click",
    () => {

        if (!enCours) {
            return;
        }

        enCours = false;

        ajouterLog(
            "⛔ Test arrêté."
        );

        mettreAJour();

        terminerTest();

    }
);

</script>

</body>
</html>
